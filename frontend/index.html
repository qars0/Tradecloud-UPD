<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TradeCloud - Главная</title>
    
    <!-- Fonts -->
    <link href="https://fonts.yandex.net/text/text.css" rel="stylesheet">
    <!-- Icons -->
    <link href='https://cdn.boxicons.com/3.0.6/fonts/basic/boxicons.min.css' rel='stylesheet'>
    <link href='https://cdn.boxicons.com/3.0.6/fonts/brands/boxicons-brands.min.css' rel='stylesheet'>
    
    <!-- Styles -->
    <link rel="stylesheet" href="src/css/main.css">
    <link rel="stylesheet" href="src/css/components/header.css">
</head>
<body>

    <!-- Сюда JS вставит хедер -->
    <div id="header-container"></div>

    <main style="padding: 20px; max-width: var(--container-width); margin: 0 auto;">
        <!-- Временные кнопки для теста хедера -->
        <div style="margin-top: 100px; text-align: center;">
            <h1>Добро пожаловать в TradeCloud</h1>
            <p style="margin-bottom: 20px;">Тест переключения состояния хедера:</p>
            <button onclick="localStorage.setItem('isLoggedIn', 'true'); location.reload();" style="padding: 10px;">
                Войти (Эмуляция)
            </button>
            <button onclick="localStorage.setItem('isLoggedIn', 'false'); location.reload();" style="padding: 10px;">
                Выйти (Эмуляция)
            </button>
        </div>
    </main>

    <!-- Scripts -->
    <script src="src/js/components/header.js"></script>
</body>
</html>

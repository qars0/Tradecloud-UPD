<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TradeCloud - Главная</title>
    
    <link href="https://fonts.yandex.net/text/text.css" rel="stylesheet">
    <link href='https://cdn.boxicons.com/3.0.6/fonts/basic/boxicons.min.css' rel='stylesheet'>
    <link href='https://cdn.boxicons.com/3.0.6/fonts/brands/boxicons-brands.min.css' rel='stylesheet'>
    
    <link rel="stylesheet" href="src/css/main.css">
    <link rel="stylesheet" href="src/css/components/header.css">
</head>
<body>

    <!-- Сюда JS вставит хедер -->
    <div id="header-container"></div>

    <main style="padding: 40px 20px; max-width: var(--container-width); margin: 0 auto;">
        
        <div style="text-align: center; margin-top: 50px;">
            <h1 style="font-size: 36px; margin-bottom: 20px;">Добро пожаловать в TradeCloud</h1>
            <p style="color: var(--text-light); font-size: 18px;">
                Безопасная площадка для студентов
            </p>
            
            <!-- Блок проверки -->
            <div style="margin-top: 40px; padding: 20px; background: white; border-radius: 20px; display: inline-block; box-shadow: var(--shadow-light);">
                <h3>Статус системы:</h3>
                <div id="status" style="margin-top: 10px;">Загрузка...</div>
            </div>
        </div>

    </main>

    <!-- Scripts -->
    <script src="src/js/components/header.js"></script>
    <script src="src/js/components/card-renderer.js"></script>
    <script>
        // Проверка API
        fetch('/api/health')
            .then(r => r.json())
            .then(d => {
                const s = document.getElementById('status');
                s.innerHTML = `✅ Сервер: ${d.status}`;
                s.style.color = 'green';
            })
            .catch(() => {
                document.getElementById('status').innerText = '❌ Ошибка подключения';
            });
    </script>
</body>
</html>

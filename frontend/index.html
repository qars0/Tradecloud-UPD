<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TradeCloud - Главная</title>
    <link href="https://fonts.yandex.net/text/text.css" rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="src/css/main.css">
    <link rel="stylesheet" href="src/css/components/header.css">
    <link rel="stylesheet" href="src/css/components/cards.css">
    <link rel="stylesheet" href="src/css/pages/home.css"> <!-- Новый файл -->
</head>
<body>

    <div id="header-container"></div>

    <main style="max-width: 1320px; margin: 40px auto; padding: 0 20px;">
        
        <!-- HERO SECTION -->
        <section class="hero-section">
            <div class="hero-content">
                <h1 class="hero-title">
                    Найди что <span>нужно</span>,<br>
                    продай что <span>не нужно</span>
                </h1>
                <p class="hero-subtitle">
                    Безопасная площадка. Гаджеты, услуги и аренда вещей, аукционы — всё в одном месте.
                </p>
                <div class="hero-btns">
                    <a href="/catalog.html" class="btn-hero-primary">Перейти в каталог</a>
                    <a href="/listing-form.html" class="btn-hero-secondary">
                        <i class='bx bx-plus'></i> Разместить
                    </a>
                </div>
            </div>

            <div class="hero-visual" id="hero-cards-container">
                <!-- Карточки загрузятся JS-ом -->
                <!-- Фолбек (скелет) на случай долгой загрузки -->
                <div class="floating-card" style="--rot: -10deg; opacity: 0.5;"></div>
                <div class="floating-card" style="--rot: 5deg; opacity: 0.5;"></div>
                <div class="floating-card" style="--rot: 12deg; opacity: 0.5;"></div>
            </div>
        </section>

        <!-- CATEGORIES -->
        <section>
            <div class="section-header">
                <h2 class="section-title">Категории</h2>
                <a href="/catalog.html" style="color: var(--primary-color); font-weight: 500; text-decoration: none;">
                    Все категории <i class='bx bx-right-arrow-alt'></i>
                </a>
            </div>
            
            <div class="categories-grid" id="categories-container">
                <!-- JS вставит категории -->
                <div style="grid-column: 1/-1; text-align: center;">Загрузка...</div>
            </div>
        </section>

        <!-- FRESH LISTINGS -->
        <section class="listings-section">
            <div class="section-header">
                <h2 class="section-title">🔥 Свежие предложения</h2>
            </div>

            <div id="fresh-listings" class="listings-grid">
                <div class="empty-state">Загрузка...</div>
            </div>
        </section>

    </main>

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="src/js/components/header.js"></script>
    <script src="src/js/components/card-renderer.js"></script>
    <script src="src/js/pages/home.js"></script> <!-- Новый скрипт -->
</body>
</html>

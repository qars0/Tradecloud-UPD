<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профиль - TradeCloud</title>
    <link href="https://fonts.yandex.net/text/text.css" rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="src/css/main.css">
    <link rel="stylesheet" href="src/css/components/header.css">
    <link rel="stylesheet" href="src/css/components/cards.css">
    <link rel="stylesheet" href="src/css/pages/reviews.css"> <!-- Для отзывов -->
    <link rel="stylesheet" href="src/css/pages/profile.css"> <!-- Новый стиль -->
</head>
<body>

    <div id="header-container"></div>

    <!-- Декоративная обложка -->
    <div class="profile-cover"></div>

    <main class="profile-container">
        
        <!-- КАРТОЧКА ПОЛЬЗОВАТЕЛЯ -->
        <aside class="user-card">
            <div class="avatar-wrapper">
                <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" alt="Avatar" class="user-avatar" id="profile-avatar">
                
                <!-- Кнопка смены аватара (Только для владельца) -->
                <label for="avatar-input" class="avatar-edit-trigger" id="avatar-edit-btn">
                    <i class='bx bx-camera'></i>
                </label>
                <input type="file" id="avatar-input" hidden accept="image/*">
            </div>

            <h1 class="user-name" id="profile-name">Загрузка...</h1>
            <div class="user-login" id="profile-login">@username</div>

            <div class="user-stats">
                <div class="stat-box">
                    <span class="stat-num" id="stat-listings">0</span>
                    <span class="stat-label">Товаров</span>
                </div>
                <div class="stat-box">
                    <span class="stat-num" id="stat-rating">0.0</span>
                    <span class="stat-label">Рейтинг</span>
                </div>
                <div class="stat-box">
                    <span class="stat-num" id="stat-sales">0</span>
                    <span class="stat-label">Сделок</span>
                </div>
            </div>

            <!-- Кнопки (динамические) -->
            <div class="profile-actions" id="profile-actions">
                <!-- Сюда JS вставит кнопки (Написать ИЛИ Редактировать) -->
            </div>
            
            <div style="margin-top: 20px; font-size: 13px; color: #999;">
                На сайте с <span id="join-date">...</span>
            </div>
        </aside>

        <!-- КОНТЕНТ (ТАБЫ) -->
        <section class="content-section">
            <div class="tabs-nav">
                <button class="tab-link active" data-tab="listings">Объявления</button>
                <button class="tab-link" data-tab="reviews">Отзывы</button>
                <!-- Таб настроек только для владельца -->
                <button class="tab-link" data-tab="settings" id="tab-btn-settings" style="display:none">Настройки</button>
            </div>

            <!-- 1. Объявления -->
            <div class="tab-pane active" id="tab-listings">
                <div id="listings-grid" class="listings-grid">
                    <div class="empty-state">Загрузка...</div>
                </div>
            </div>

            <!-- 2. Отзывы -->
            <div class="tab-pane" id="tab-reviews">
                <div id="reviews-container">
                    <div class="empty-state">Отзывов пока нет</div>
                </div>
            </div>

            <!-- 3. Настройки -->
            <div class="tab-pane" id="tab-settings">
                <div class="settings-box">
                    <h2 style="margin-bottom:20px">Личные данные</h2>
                    <form id="settings-form">
                        <div class="settings-group">
                            <label class="settings-label">Имя и Фамилия</label>
                            <input type="text" name="full_name" id="set-fullname" class="settings-input">
                        </div>
                        <div class="settings-group">
                            <label class="settings-label">Логин (username)</label>
                            <input type="text" name="username" id="set-username" class="settings-input">
                        </div>
                        <div class="settings-group">
                            <label class="settings-label">Email</label>
                            <input type="email" name="email" id="set-email" class="settings-input">
                        </div>
                        <div class="settings-group">
                            <label class="settings-label">Телефон</label>
                            <input type="tel" name="phone" id="set-phone" class="settings-input">
                        </div>
                        <button type="submit" class="btn-profile-primary" style="width: 100%;">
                            Сохранить изменения
                        </button>
                    </form>
                </div>
            </div>
        </section>
    </main>

    <!-- Модалка отзыва (та же самая, что была) -->
    <div class="modal-overlay" id="review-modal">
        <div class="modal-window">
            <i class='bx bx-x modal-close' id="close-modal"></i>
            <h2 class="modal-title">Написать отзыв</h2>
            <form id="review-form">
                <div class="star-rating">
                    <input type="radio" id="star5" name="rating" value="5" required /><label for="star5"><i class='bx bxs-star'></i></label>
                    <input type="radio" id="star4" name="rating" value="4" /><label for="star4"><i class='bx bxs-star'></i></label>
                    <input type="radio" id="star3" name="rating" value="3" /><label for="star3"><i class='bx bxs-star'></i></label>
                    <input type="radio" id="star2" name="rating" value="2" /><label for="star2"><i class='bx bxs-star'></i></label>
                    <input type="radio" id="star1" name="rating" value="1" /><label for="star1"><i class='bx bxs-star'></i></label>
                </div>
                <div class="settings-group">
                    <textarea name="comment" class="settings-input" placeholder="Комментарий..." style="min-height:100px"></textarea>
                </div>
                <button type="submit" class="btn-profile-primary" style="width:100%">Отправить</button>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script src="src/js/components/header.js"></script>
    <script src="src/js/components/card-renderer.js"></script>
    <script src="src/js/pages/profile.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профиль пользователя - TradeCloud</title>
    <!-- Шрифты и иконки -->
    <link href="https://fonts.yandex.net/text/text.css" rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    
    <!-- Стили -->
    <link rel="stylesheet" href="src/css/main.css">
    <link rel="stylesheet" href="src/css/components/header.css">
    <link rel="stylesheet" href="src/css/components/cards.css"> <!-- Стили карточек -->
    <link rel="stylesheet" href="src/css/pages/profile.css">   <!-- Стили профиля -->
    <link rel="stylesheet" href="src/css/pages/reviews.css">
</head>
<body>

    <div id="header-container"></div>

    <main class="main-container">
        
        <!-- Левая колонка: Карточка профиля -->
        <aside class="profile-card">
            <div class="avatar-wrapper" style="border: none;">
                <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" alt="Avatar" class="profile-avatar-large" id="profile-avatar-img">
            </div>

            <h1 class="profile-name" id="profile-name">Загрузка...</h1>
            
            <div class="profile-status">
                <span id="status-indicator" style="width: 8px; height: 8px; background: #ccc; border-radius: 50%; display: inline-block;"></span>
                <span id="status-text">Оффлайн</span>
            </div>

            <div class="rating-badge">
                <i class='bx bxs-star'></i>
                <span id="profile-rating">0.0</span>
            </div>

            <div class="profile-stats">
                <div class="stat-item">
                    <div class="stat-value" id="stat-count">0</div>
                    <div class="stat-label">Товаров</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value">0</div>
                    <div class="stat-label">Продаж</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="join-date">-</div>
                    <div class="stat-label">На сайте</div>
                </div>
            </div>

            <!-- Кнопка действия -->
            <div id="profile-actions" style="display: flex; gap: 10px; margin-top: 20px; width: 100%;">
                <button id="write-msg-btn" class="btn-catalog" style="flex: 1; justify-content: center; background: var(--accent-color);">
                    <i class='bx bx-message-rounded-dots'></i> Написать
                </button>
                
                <!-- Кнопка отзыва (оранжевая со звездой) -->
                <button id="write-review-btn" class="btn-catalog" style="width: 50px; padding: 0; justify-content: center; background: #FF9500; border: none;">
                    <i class='bx bxs-star' style="font-size: 20px;"></i>
                </button>
            </div>
        </aside>

        <!-- Правая колонка: Контент -->
        <section class="content-area">
            
            <!-- Табы -->
            <div class="tabs-header">
                <button class="tab-btn active" data-tab="listings">
                    <i class='bx bx-grid-alt'></i> Объявления пользователя
                </button>
                <button class="tab-btn" data-tab="reviews">
                    <i class='bx bx-comment-detail'></i> Отзывы
                </button>
            </div>

            <!-- Вкладка 1: Объявления -->
            <div class="tab-content active" id="tab-listings">
                <!-- Сюда JS вставит карточки -->
                <div id="listings-container" class="listings-grid">
                    <div style="grid-column: 1/-1; text-align: center; padding: 50px;">
                        Загрузка объявлений...
                    </div>
                </div>
            </div>

            <!-- Вкладка 2: Отзывы -->
            <div class="tab-content" id="tab-reviews">
                <div id="reviews-container">
                    <div style="padding: 20px; text-align: center; color: var(--text-light);">
                        Пока нет отзывов
                    </div>
                </div>
            </div>

        </section>
    </main>

    <div class="modal-overlay" id="review-modal">
        <div class="modal-window">
            <i class='bx bx-x modal-close' id="close-modal"></i>
            <h2 class="modal-title">Оценить пользователя</h2>
            
            <form id="review-form">
                <!-- Звезды (порядок 5-4-3-2-1 из-за row-reverse) -->
                <div class="star-rating">
                    <input type="radio" id="star5" name="rating" value="5" required /><label for="star5" title="Отлично"><i class='bx bxs-star'></i></label>
                    <input type="radio" id="star4" name="rating" value="4" /><label for="star4" title="Хорошо"><i class='bx bxs-star'></i></label>
                    <input type="radio" id="star3" name="rating" value="3" /><label for="star3" title="Нормально"><i class='bx bxs-star'></i></label>
                    <input type="radio" id="star2" name="rating" value="2" /><label for="star2" title="Плохо"><i class='bx bxs-star'></i></label>
                    <input type="radio" id="star1" name="rating" value="1" /><label for="star1" title="Ужасно"><i class='bx bxs-star'></i></label>
                </div>

                <div class="input-group">
                    <label>Ваш комментарий</label>
                    <textarea class="custom-textarea" name="comment" placeholder="Расскажите, как прошла сделка..." style="min-height: 100px;"></textarea>
                </div>

                <button type="submit" class="btn-apply" style="margin-top: 20px; width: 100%;">Опубликовать отзыв</button>
            </form>
        </div>
    </div>

    <script src="src/js/components/header.js"></script>
    <script src="src/js/components/card-renderer.js"></script>
    <script src="src/js/pages/public-profile.js"></script>
</body>
</html>

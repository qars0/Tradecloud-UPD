<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Объявление - TradeCloud</title>
    <link href="https://fonts.yandex.net/text/text.css" rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="src/css/main.css">
    <link rel="stylesheet" href="src/css/components/header.css">
    <link rel="stylesheet" href="src/css/pages/listing.css">
</head>
<body>

    <div id="header-container"></div>

    <main class="listing-wrapper" id="main-content">
        
        <!-- ЛЕВАЯ КОЛОНКА -->
        <div class="left-column">
            
            <!-- Галерея -->
            <div class="gallery-card">
                <div class="main-image-frame">
                    <!-- Плашка статуса (генерируется JS) -->
                    <div id="type-badge"></div> 
                    <img id="main-img" src="" class="main-image" alt="Фото товара">
                </div>
                <div class="thumbs-scroll" id="thumbs-container">
                    <!-- Миниатюры -->
                </div>
            </div>

            <!-- Детали -->
            <div class="details-card">
                <div class="listing-header">
                    <h1 class="listing-title" id="listing-title">Загрузка...</h1>
                    <div class="listing-meta">
                        <div class="meta-item">
                            <i class='bx bx-calendar'></i> <span id="publish-date">...</span>
                        </div>
                        <div class="meta-item">
                            <i class='bx bx-show'></i> <span>123 просмотра</span>
                        </div>
                        <div class="meta-item">
                            <i class='bx bx-id-card'></i> ID: <span id="listing-id-display">...</span>
                        </div>
                    </div>
                </div>

                <h3 style="margin-bottom:15px; font-size:20px;">Описание</h3>
                <div class="description-content" id="desc-text">
                    ...
                </div>
            </div>
        </div>

        <!-- ПРАВАЯ КОЛОНКА (Sticky) -->
        <div class="right-column">
            
            <!-- Карточка Цены и Действий -->
            <div class="action-card">
                
                <!-- Блок цены -->
                <div class="price-box" id="price-box">
                    <div class="price-label" id="price-label">Цена</div>
                    <div style="display:flex; align-items:baseline; gap:5px;">
                        <span class="main-price" id="price-val">...</span>
                    </div>
                </div>

                <!-- Блок Аукциона (Скрыт по умолчанию) -->
                <div id="auction-interface" class="auction-ui" style="display: none;">
                    <div style="text-align:center; margin-bottom:10px; font-size:14px; font-weight:600; color:#D35400">
                        <span class="live-badge"></span> До конца торгов:
                    </div>
                    
                    <div class="timer-display">
                        <div class="timer-part"><div class="time-val" id="t-days">0</div><div class="time-lbl">Дн</div></div>
                        <div class="timer-part"><div class="time-val" id="t-hours">00</div><div class="time-lbl">Час</div></div>
                        <div class="timer-part"><div class="time-val" id="t-min">00</div><div class="time-lbl">Мин</div></div>
                        <div class="timer-part"><div class="time-val" id="t-sec">00</div><div class="time-lbl">Сек</div></div>
                    </div>

                    <div style="display:flex; justify-content:space-between; font-size:13px; margin-bottom:10px; color:#555;">
                        <span>Текущая ставка:</span>
                        <span style="font-weight:700" id="current-bid">0 ₽</span>
                    </div>

                    <form id="bid-form" style="display:flex; gap:10px;">
                        <input type="number" id="bid-input" placeholder="Сумма" style="width:100%; padding:10px; border-radius:10px; border:1px solid #ddd;" required>
                        <button type="submit" class="btn-primary-action" style="padding:10px 20px;"><i class='bx bx-check'></i></button>
                    </form>
                    <div id="bid-msg" style="font-size:12px; margin-top:5px;"></div>
                    
                    <!-- История (свернутая) -->
                    <div class="history-list" id="bid-history" style="margin-top:15px; max-height:100px; overflow-y:auto; font-size:12px;"></div>
                </div>

                <!-- Кнопки действий -->
                <div class="action-btn-group" id="standard-actions">
                    <button id="btn-show-phone" class="btn-primary-action">
                        <i class='bx bx-phone'></i> Показать телефон
                    </button>
                    <button id="btn-write-msg" class="btn-secondary-action">
                        <i class='bx bx-message-rounded-dots'></i> Написать
                    </button>
                    <button id="fav-btn" class="btn-secondary-action" style="border:none; color:#777; background:none; font-size:14px;">
                        <i class='bx bx-heart'></i> Добавить в избранное
                    </button>
                </div>

                <!-- Кнопка жалобы -->
                <div style="text-align:center; margin-top:20px;">
                    <button onclick="openReportModal()" style="background:none; border:none; color:#bbb; font-size:12px; cursor:pointer; display:flex; align-items:center; gap:5px; margin:0 auto; transition:0.2s">
                        <i class='bx bx-flag'></i> Пожаловаться
                    </button>
                </div>
            </div>

            <!-- Карточка Продавца -->
            <div class="seller-card" id="seller-link">
                <img src="" id="seller-ava" class="seller-img">
                <div class="seller-info">
                    <h4 id="seller-name">Имя Продавца</h4>
                    <div class="seller-rating">
                        <i class='bx bxs-star'></i> <span id="seller-rating">0.0</span> 
                        <span style="color:#999; font-weight:400; font-size:12px;">(смотреть профиль)</span>
                    </div>
                </div>
                <i class='bx bx-chevron-right' style="margin-left:auto; color:#ccc; font-size:24px;"></i>
            </div>

            <!-- ПАНЕЛЬ ВЛАДЕЛЬЦА (Скрыта) -->
            <div id="owner-controls" class="owner-panel" style="display: none;">
                <h4 style="margin-bottom:15px; color:var(--text-dark)"><i class='bx bx-cog'></i> Управление</h4>
                <div class="action-btn-group">
                    <button id="btn-mark-sold" class="btn-secondary-action" style="font-size:14px;">Снять с продажи</button>
                    <button id="btn-delete" class="btn-secondary-action" style="border-color:var(--danger-color); color:var(--danger-color); font-size:14px;">Удалить</button>
                </div>
            </div>

        </div>
    </main>

    <!-- Модальное окно жалобы -->
    <div class="modal-overlay" id="report-modal">
        <div class="modal-window">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                <h2 style="font-size:20px; font-weight:700">Пожаловаться</h2>
                <i class='bx bx-x' onclick="closeReportModal()" style="font-size:28px; cursor:pointer;"></i>
            </div>
            <form id="report-form">
                <div style="margin-bottom:15px;">
                    <label style="display:block; font-size:14px; margin-bottom:5px; font-weight:600;">Причина</label>
                    <select name="reason" style="width:100%; padding:12px; border-radius:10px; border:1px solid #ddd;" required>
                        <option value="spam">Спам</option>
                        <option value="fraud">Мошенничество</option>
                        <option value="forbidden">Запрещенный товар</option>
                    </select>
                </div>
                <div style="margin-bottom:20px;">
                    <label style="display:block; font-size:14px; margin-bottom:5px; font-weight:600;">Комментарий</label>
                    <textarea name="comment" style="width:100%; padding:12px; border-radius:10px; border:1px solid #ddd; min-height:80px;" required></textarea>
                </div>
                <button type="submit" class="btn-primary-action" style="width:100%; background:var(--danger-color);">Отправить</button>
            </form>
        </div>
    </div>

    <!-- Скрипты -->
     <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="src/js/components/header.js"></script>
    <script src="src/js/components/card-renderer.js"></script>
    <script src="src/js/pages/listing.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Редактировать - TradeCloud</title>
    <link href="https://fonts.yandex.net/text/text.css" rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="src/css/main.css">
    <link rel="stylesheet" href="src/css/components/header.css">
    <!-- Используем тот же CSS, что и при создании -->
    <link rel="stylesheet" href="src/css/pages/create-listing.css">
    <style>
        /* Доп стили для существующих фото */
        .existing-photos {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        .photo-card {
            position: relative;
            width: 100px;
            height: 100px;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .photo-card img { width: 100%; height: 100%; object-fit: cover; }
        .photo-delete {
            position: absolute; top: 5px; right: 5px;
            background: rgba(255,255,255,0.9); color: var(--danger-color);
            border-radius: 50%; width: 24px; height: 24px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: 0.2s;
        }
        .photo-delete:hover { transform: scale(1.1); background: white; }
    </style>
</head>
<body>

    <div id="header-container"></div>

    <div class="create-container">
        <form class="form-card" id="edit-form">
            
            <div class="form-header">
                <h1>Редактирование</h1>
                <p>Измените информацию о товаре</p>
            </div>

            <!-- Секция 1: Основное -->
            <div class="form-section">
                <div class="section-title"><i class='bx bx-edit'></i> Основная информация</div>
                
                <div class="input-group">
                    <label>Название</label>
                    <input type="text" class="custom-input" name="title" id="input-title" required>
                </div>

                <div class="input-group">
                    <label>Категория</label>
                    <select class="custom-select" name="category_id" id="category-select" required>
                        <option value="" disabled selected>Загрузка...</option>
                    </select>
                </div>
                
                <!-- Тип объявления менять не даем, чтобы не ломать аукционы -->
                <div class="input-group">
                    <label>Тип сделки</label>
                    <input type="text" class="custom-input" id="input-type-display" disabled style="background:#eee; color:#777">
                </div>
            </div>

            <!-- Секция 2: Детали -->
            <div class="form-section">
                <div class="section-title"><i class='bx bx-ruble'></i> Стоимость</div>
                
                <div class="input-group">
                    <label id="price-label-text">Цена (₽)</label>
                    <div style="display: flex; gap: 10px; align-items: center;">
                        <input type="number" class="custom-input" name="price" id="input-price" required>
                        
                        <label style="display: flex; align-items: center; gap: 5px; cursor: pointer; margin: 0;">
                            <input type="checkbox" name="is_price_from" id="input-is-from" value="true" style="width: 18px; height: 18px;">
                            <span>От</span>
                        </label>
                    </div>
                </div>

                <div class="input-group" id="unit-selector">
                    <label>Единица измерения</label>
                    <select class="custom-select" name="price_unit" id="input-unit">
                        <option value="">Нет</option>
                        <option value="piece">за шт.</option>
                        <option value="hour">за час</option>
                        <option value="day">за сутки</option>
                        <option value="service">за услугу</option>
                    </select>
                </div>

                <div class="input-group">
                    <label>Описание</label>
                    <textarea class="custom-textarea" name="description" id="input-desc" required></textarea>
                </div>
            </div>

            <!-- Секция 3: Фотографии -->
            <div class="form-section">
                <div class="section-title"><i class='bx bx-images'></i> Фотографии</div>
                
                <p style="font-size:14px; margin-bottom:10px;">Текущие фото:</p>
                <div class="existing-photos" id="existing-photos-container">
                    <!-- Сюда JS загрузит фото -->
                </div>

                <p style="font-size:14px; margin-bottom:10px; margin-top:20px;">Добавить новые:</p>
                <div class="upload-zone" id="drop-zone">
                    <input type="file" id="file-input" multiple accept="image/*" hidden>
                    <i class='bx bx-cloud-upload upload-icon'></i>
                    <div class="upload-text">Нажмите или перетащите фото сюда</div>
                </div>
                <div class="preview-container" id="preview-container"></div>
            </div>

            <button type="submit" class="submit-btn">Сохранить изменения</button>
            <a href="javascript:history.back()" style="display:block; text-align:center; margin-top:15px; color:#777; text-decoration:none">Отмена</a>
        </form>
    </div>

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="src/js/components/header.js"></script>
    <script src="src/js/pages/edit-listing.js"></script>
</body>
</html>

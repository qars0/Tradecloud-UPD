<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TradeCloud - Вход и Регистрация</title>
    <link href="https://fonts.yandex.net/text/text.css" rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="src/css/main.css">
    <link rel="stylesheet" href="src/css/components/header.css">
    <link rel="stylesheet" href="src/css/pages/auth.css">
</head>
<body>

    <div id="header-container"></div>

    <div class="auth-container">
        <div class="container">
            <div class="forms-container">
                <div class="signin-signup">
                    <!-- ... Форма Входа ... -->
                    <form action="#" class="sign-in-form" id="login-form">
                        <h2 class="title">Вход</h2>
                        <div class="input-field">
                            <i class='bx bxs-user icon-left'></i>
                            <input type="text" placeholder="Логин" name="username" required />
                        </div>
                        <div class="input-field">
                            <i class='bx bxs-lock-alt icon-left'></i>
                            <input type="password" placeholder="Пароль" name="password" required />
                            <i class='bx bx-hide toggle-password'></i>
                        </div>
                        <p class="error-msg" id="login-error"></p>
                        <input type="submit" value="Войти" class="btn-solid" />
                    </form>

                    <!-- Форма Регистрации -->
                    <form action="#" class="sign-up-form" id="register-form">
                        <h2 class="title">Регистрация</h2>
                        <div class="input-field">
                            <i class='bx bxs-id-card icon-left'></i>
                            <input type="text" placeholder="Имя Фамилия" name="full_name" required />
                        </div>
                        <div class="input-field">
                            <i class='bx bxs-user icon-left'></i>
                            <input type="text" placeholder="Придумайте логин" name="username" required />
                        </div>
                        <div class="input-field">
                            <i class='bx bxs-envelope icon-left'></i>
                            <input type="email" placeholder="Email" name="email" required />
                        </div>
                        <!-- Новое поле Телефон -->
                        <div class="input-field">
                            <i class='bx bxs-phone icon-left'></i>
                            <input type="tel" placeholder="Телефон" name="phone" required />
                        </div>
                        <div class="input-field">
                            <i class='bx bxs-lock-alt icon-left'></i>
                            <input type="password" placeholder="Пароль" name="password" required />
                            <i class='bx bx-hide toggle-password'></i>
                        </div>
                        <p class="error-msg" id="register-error"></p>
                        <input type="submit" value="Создать" class="btn-solid" />
                    </form>
                </div>
            </div>

            <div class="panels-container">
                <!-- Левая панель (Видна по умолчанию) -->
                <div class="panel left-panel">
                    <div class="content">
                        <h3>Нет аккаунта?</h3>
                        <p>Создайте профиль и начните торговать сейчас.</p>
                        <button class="btn-transparent" id="sign-up-btn">Регистрация</button>
                    </div>
                </div>
                
                <!-- Правая панель (Видна при регистрации) -->
                <div class="panel right-panel">
                    <div class="content">
                        <h3>Уже есть аккаунт?</h3>
                        <p>Войдите, чтобы управлять объявлениями.</p>
                        <button class="btn-transparent" id="sign-in-btn">Войти</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="src/js/components/header.js"></script>
    <script src="src/js/pages/auth.js"></script>
</body>
</html>

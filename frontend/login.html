<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход - TradeCloud</title>
    <link href="https://fonts.yandex.net/text/text.css" rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="src/css/main.css">
    <link rel="stylesheet" href="src/css/components/header.css">
    <link rel="stylesheet" href="src/css/pages/auth.css"> <!-- Новый стиль -->
    <script src="https://unpkg.com/imask"></script>
</head>
<body>

    <div id="header-container"></div>

    <!-- Живой фон -->
    <div class="background-mesh">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <div class="auth-wrapper">
        <div class="auth-card" id="auth-card">
            
            <!-- Переключатель (Табы) -->
            <div class="auth-toggle">
                <div class="toggle-bg" id="toggle-bg"></div>
                <button class="toggle-btn active" id="tab-login">Вход</button>
                <button class="toggle-btn" id="tab-register">Регистрация</button>
            </div>

            <div class="forms-slider" id="forms-slider">
                
                <!-- 1. ВХОД -->
                <form class="auth-form" id="login-form">
                    <div class="form-header">
                        <h2>С возвращением!</h2>
                        <p>Введите свои данные для входа</p>
                    </div>

                    <div class="input-group">
                        <div class="input-field">
                            <i class='bx bx-user'></i>
                            <input type="text" name="username" placeholder="Логин" required>
                        </div>
                    </div>

                    <div class="input-group">
                        <div class="input-field">
                            <i class='bx bx-lock-alt'></i>
                            <input type="password" name="password" placeholder="Пароль" required>
                            <i class='bx bx-hide toggle-pass'></i>
                        </div>
                    </div>

                    <div class="form-actions">
                        <a href="#" class="forgot-link">Забыли пароль?</a>
                    </div>

                    <p class="error-message" id="login-error"></p>

                    <button type="submit" class="btn-submit">Войти</button>
                </form>

                <!-- 2. РЕГИСТРАЦИЯ (Multi-step) -->
                <form class="auth-form hidden" id="register-form">
                    
                    <!-- Шаг 1 -->
                    <div class="reg-step active" id="step-1">
                        <div class="form-header">
                            <h2>Создание аккаунта</h2>
                            <p>Шаг 1: Данные для входа</p>
                        </div>

                        <div class="input-group" id="group-reg-username">
                            <div class="input-field">
                                <i class='bx bx-user'></i>
                                <input type="text" id="reg-username" placeholder="Придумайте логин">
                            </div>
                            <span class="error-text"></span>
                        </div>

                        <div class="input-group" id="group-reg-password">
                            <div class="input-field">
                                <i class='bx bx-lock-alt'></i>
                                <input type="password" id="reg-password" placeholder="Пароль">
                                <i class='bx bx-hide toggle-pass'></i>
                            </div>
                            <span class="error-text"></span>
                        </div>

                        <div class="input-group" id="group-reg-confirm">
                            <div class="input-field">
                                <i class='bx bx-check-shield'></i>
                                <input type="password" id="reg-confirm" placeholder="Повторите пароль">
                            </div>
                            <span class="error-text"></span>
                        </div>

                        <button type="button" class="btn-submit" id="btn-next">Далее</button>
                    </div>

                    <!-- Шаг 2 -->
                    <div class="reg-step" id="step-2">
                        <div class="form-header">
                            <h2>Личные данные</h2>
                            <p>Шаг 2: Контакты</p>
                        </div>

                        <div class="input-group" id="group-reg-fullname">
                            <div class="input-field">
                                <i class='bx bx-id-card'></i>
                                <input type="text" id="reg-fullname" placeholder="Имя и Фамилия">
                            </div>
                            <span class="error-text"></span>
                        </div>

                        <div class="input-group" id="group-reg-email">
                            <div class="input-field">
                                <i class='bx bx-envelope'></i>
                                <input type="email" id="reg-email" placeholder="Email">
                            </div>
                            <span class="error-text"></span>
                        </div>

                        <div class="input-group" id="group-reg-phone">
                            <div class="input-field">
                                <i class='bx bx-phone'></i>
                                <input type="tel" id="reg-phone" placeholder="+7 (___) ___-__-__">
                            </div>
                            <span class="error-text"></span>
                        </div>

                        <div class="buttons-row">
                            <button type="button" class="btn-back" id="btn-prev">Назад</button>
                            <button type="submit" class="btn-submit">Создать аккаунт</button>
                        </div>
                        <p class="error-message" id="register-error"></p>
                    </div>

                </form>
            </div>
        </div>
    </div>

    <script src="src/js/components/header.js"></script>
    <script src="src/js/pages/auth.js"></script>
</body>
</html>

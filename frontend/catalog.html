<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Каталог - TradeCloud</title>
    <link href="https://fonts.yandex.net/text/text.css" rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="src/css/main.css">
    <link rel="stylesheet" href="src/css/components/header.css">
    <link rel="stylesheet" href="src/css/components/cards.css">
    <link rel="stylesheet" href="src/css/pages/catalog.css">
</head>
<body>

    <div id="header-container"></div>
    <div class="background-mesh">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>
    <div class="catalog-container">
        
        <!-- Сайдбар -->
        <aside class="filters-sidebar" id="filters-sidebar">
            <div style="display:flex; justify-content:space-between; margin-bottom:20px;">
                <h2>Фильтры</h2>
                <i class='bx bx-x' id="close-filters" style="font-size:24px; cursor:pointer; display:none"></i>
            </div>

            <!-- Категории -->
            <div class="filter-group">
                <div class="filter-title">Категория</div>
                <div class="chips-group" id="category-filters">
                    <!-- JS -->
                </div>
            </div>

            <!-- Тип -->
            <div class="filter-group">
                <div class="filter-title">Тип сделки</div>
                <div class="chips-group">
                    <label class="filter-chip"><input type="radio" name="type" value="" checked><span class="chip-content">Все</span></label>
                    <label class="filter-chip"><input type="radio" name="type" value="sell"><span class="chip-content">Купить</span></label>
                    <label class="filter-chip"><input type="radio" name="type" value="rent"><span class="chip-content">Аренда</span></label>
                    <label class="filter-chip"><input type="radio" name="type" value="auction"><span class="chip-content">Аукцион</span></label>
                    <label class="filter-chip"><input type="radio" name="type" value="service"><span class="chip-content">Услуги</span></label>
                </div>
            </div>

            <!-- Цена -->
            <div class="filter-group">
                <div class="filter-title">Цена</div>
                <div class="price-inputs">
                    <input type="number" id="min-price" class="price-field" placeholder="От">
                    <input type="number" id="max-price" class="price-field" placeholder="До">
                </div>
            </div>

            <button class="btn-apply" onclick="applyFilters(1)">Применить</button>
            <button class="btn-reset" onclick="resetFilters()">Сбросить</button>
        </aside>

        <!-- Контент -->
        <main class="catalog-main">
            
            <div class="catalog-header">
                <div class="search-wrapper">
                    <i class='bx bx-search'></i>
                    <input type="text" id="search-input" class="search-input" placeholder="Поиск по названию...">
                </div>

                <div class="mobile-filter-toggle" onclick="toggleSidebar()">
                    <i class='bx bx-filter-alt'></i> Фильтры
                </div>

                <select class="sort-select" id="sort-select" onchange="applyFilters(1)">
                    <option value="new">Сначала новые</option>
                    <option value="cheap">Сначала дешевые</option>
                    <option value="expensive">Сначала дорогие</option>
                </select>
            </div>

            <!-- Активные фильтры -->
            <div class="active-filters" id="active-filters"></div>

            <!-- Сетка -->
            <div id="catalog-grid" class="catalog-grid"></div>

            <!-- Пагинация -->
            <div id="pagination" class="pagination"></div>

        </main>
    </div>

    <!-- Оверлей для мобильного меню -->
    <div class="modal-overlay" id="sidebar-overlay" onclick="toggleSidebar()"></div>

    <script src="src/js/components/header.js"></script>
    <script src="src/js/components/card-renderer.js"></script>
    <script src="src/js/pages/catalog.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Избранное - TradeCloud</title>
    <link href="https://fonts.yandex.net/text/text.css" rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="src/css/main.css">
    <link rel="stylesheet" href="src/css/components/header.css">
    <link rel="stylesheet" href="src/css/components/cards.css">
</head>
<body>

    <div id="header-container"></div>

    <main style="max-width: 1200px; margin: 0 auto; padding: 40px 20px;">
        <h1 style="margin-bottom: 30px; display:flex; align-items:center; gap:10px;">
            <i class='bx bxs-heart' style="color: #FF3B30;"></i> Избранное
        </h1>

        <div id="favorites-grid" class="listings-grid">
            <div class="empty-state">Загрузка...</div>
        </div>
    </main>

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="src/js/components/header.js"></script>
    <script src="src/js/components/card-renderer.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            // Проверка авторизации
            if (localStorage.getItem('isLoggedIn') !== 'true') {
                window.location.href = '/login.html';
                return;
            }

            const container = document.getElementById('favorites-grid');

            try {
                // Запрос на специальный роут /api/favorites
                const res = await fetch('/api/favorites');
                const listings = await res.json();

                container.innerHTML = '';

                if (listings.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <i class='bx bx-heart'></i>
                            <h3>Список избранного пуст</h3>
                            <p>Добавляйте товары, чтобы не потерять их</p>
                            <a href="/index.html" class="btn-create" style="display:inline-block; margin-top:10px">Перейти в каталог</a>
                        </div>
                    `;
                    return;
                }

                listings.forEach(item => {
                    container.innerHTML += renderCard(item);
                });

            } catch (err) {
                console.error(err);
                container.innerHTML = '<div class="empty-state">Ошибка загрузки</div>';
            }
        });
    </script>
</body>
</html>
